name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout idea-alps-plugin
        uses: actions/checkout@v4
        with:
          path: idea-alps-plugin

      # @alps-asd/app-state-diagram 2.1.0 isn't published yet (npm latest is
      # 2.0.0); web/ depends on this sibling checkout via a `file:` dependency
      # until it ships. Track the canonical upstream branch, not a fork, so
      # this doesn't depend on a personal working branch surviving. See
      # README.md.
      - name: Checkout app-state-diagram (unpublished 2.1.0)
        uses: actions/checkout@v4
        with:
          repository: alps-asd/app-state-diagram
          ref: '2.x'
          path: app-state-diagram

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: app-state-diagram/pnpm-lock.yaml

      - name: Build app-state-diagram dist
        working-directory: app-state-diagram
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @alps-asd/app-state-diagram build

      - name: Install web/ dependencies
        working-directory: idea-alps-plugin/web
        run: npm install

      - name: Type-check web bundle
        working-directory: idea-alps-plugin/web
        run: npm run check

      - name: Build web bundle
        working-directory: idea-alps-plugin/web
        run: npm run build

      - name: Smoke-test rendered SVG output
        working-directory: idea-alps-plugin/web
        run: npm run smoke

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches ~/.gradle, including the resolved PhpStorm IDE distribution and
      # Plugin Verifier (~2 GB) — without this every run re-downloads them.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: idea-alps-plugin

      - name: Gradle test (headless BasePlatformTestCase)
        working-directory: idea-alps-plugin
        run: ./gradlew test --console=plain

      - name: Gradle buildPlugin
        working-directory: idea-alps-plugin
        run: ./gradlew buildPlugin --console=plain

      - name: Gradle verifyPlugin
        working-directory: idea-alps-plugin
        run: ./gradlew verifyPlugin --console=plain

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: idea-alps-plugin
          path: idea-alps-plugin/build/distributions/*.zip
